spring:
  application:
    name: workflow-engine

  datasource:
    url: jdbc:h2:file:./data/workflowdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  mvc:
    async:
      request-timeout: -1  # Needed for SSE — no timeout

server:
  port: 8080

logging:
  level:
    com.workflow: INFO
    org.springframework.scheduling: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
